name: OpenFin Positive Staging Suite

on:
  workflow_dispatch:
    inputs:
      mcp_url:
        description: "Staging MCP /mcp endpoint for a reviewed candidate generation"
        required: true
        type: string
      expected_commit:
        description: "Expected candidate deployment commit"
        required: true
        type: string
      expected_generation:
        description: "Expected candidate generation id"
        required: true
        type: string
      expected_candidate_set_checksum:
        description: "Expected candidate set checksum"
        required: true
        type: string
      expected_policy_version:
        description: "Expected policy version"
        required: true
        type: string
      expected_ranking_version:
        description: "Expected ranking version"
        required: true
        type: string
      expected_calculator_version:
        description: "Expected calculator version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  financial-quality-staging-positive:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Require every positive fixture to pass
        run: npm --silent run financial-quality-live > ../financial-quality-staging-report.json
        env:
          MCP_URL: ${{ inputs.mcp_url }}
          OPENFIN_REQUIRE_POSITIVE_RUNTIME: "true"
          EXPECTED_DEPLOYMENT_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_GENERATION_ID: ${{ inputs.expected_generation }}
          EXPECTED_CANDIDATE_SET_CHECKSUM: ${{ inputs.expected_candidate_set_checksum }}
          EXPECTED_POLICY_VERSION: ${{ inputs.expected_policy_version }}
          EXPECTED_RANKING_VERSION: ${{ inputs.expected_ranking_version }}
          EXPECTED_CALCULATOR_VERSION: ${{ inputs.expected_calculator_version }}
      - name: Validate positive runtime contract
        working-directory: .
        run: |
          set -euo pipefail
          test "$(jq -r '.live_execution_status' financial-quality-staging-report.json)" = executed
          test "$(jq -r '.live_status' financial-quality-staging-report.json)" = current
          test "$(jq '.live_blocked_cases | length' financial-quality-staging-report.json)" = 0
          test "$(jq '.live_positive_cases | length' financial-quality-staging-report.json)" = "$(jq -r '.positive_fixture_count' financial-quality-staging-report.json)"
          test "$(jq -r '.runtime_contract.deployment_commit' financial-quality-staging-report.json)" = "${{ inputs.expected_commit }}"
          test "$(jq -r '.runtime_contract.generation_id' financial-quality-staging-report.json)" = "${{ inputs.expected_generation }}"
          test "$(jq -r '.runtime_contract.candidate_set_checksum' financial-quality-staging-report.json)" = "${{ inputs.expected_candidate_set_checksum }}"
          test "$(jq -r '.runtime_contract.policy_version' financial-quality-staging-report.json)" = "${{ inputs.expected_policy_version }}"
          test "$(jq -r '.runtime_contract.ranking_version' financial-quality-staging-report.json)" = "${{ inputs.expected_ranking_version }}"
          test "$(jq -r '.runtime_contract.calculator_version' financial-quality-staging-report.json)" = "${{ inputs.expected_calculator_version }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: openfin-staging-positive-${{ github.run_id }}
          path: financial-quality-staging-report.json
          retention-days: 30
