name: Track OpenFin Sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-tracking
  cancel-in-progress: false

jobs:
  inspect-sources:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: ${{ runner.temp }}/openfin-source-report
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check sources without changing status or receipts
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npm run knowledge:track-sources -- --report-dir "$REPORT_DIR"
      - name: Build impact report
        run: npm run knowledge:source-impact-report -- --status-report "$REPORT_DIR/source-status-report.json" --output "$REPORT_DIR/source-impact-report.json"
      - name: Upload manual inspection report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: openfin-source-report-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 3
          if-no-files-found: warn
      - name: Summarize manual inspection
        run: |
          echo 'Source reports are available in the artifact. Review and apply changes locally, then submit a human-reviewed PR.' >> "$GITHUB_STEP_SUMMARY"
