name: Deploy OpenFin MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfin-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Refuse legacy direct production deployment
        run: |
          echo 'Legacy direct Worker deployment is disabled. Run the OpenFin Immutable Release workflow.' >&2
          exit 1
