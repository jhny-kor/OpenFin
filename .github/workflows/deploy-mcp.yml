name: Deploy OpenFin MCP

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "contracts/**"
      - "schemas/**"
      - "scripts/knowledge/derive-quality.mjs"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfin-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Test Worker
        run: npm test
      - name: Verify release integrity
        run: npm run verify:integrity
      - name: Verify recommendation gate
        run: npm run verify:recommendation
      - name: Deploy Worker
        run: npx wrangler deploy --var DEPLOYMENT_COMMIT:"$DEPLOYMENT_COMMIT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_COMMIT: ${{ github.sha }}
      - name: Smoke test health and readiness
        run: npm run smoke
        env:
          EXPECTED_DEPLOYMENT_COMMIT: ${{ github.sha }}
