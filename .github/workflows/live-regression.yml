name: OpenFin Live Regression

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy OpenFin MCP]
    types: [completed]

permissions:
  contents: write

jobs:
  live-regression:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Validate checked-in 120-case fixture
        run: npm run live-regression -- --validate-fixture
      - name: Run current deployment suite
        continue-on-error: true
        run: node scripts/live-regression.mjs > ../live-regression-report.json
        env:
          MCP_URL: https://openfin-mcp.y2kthr.workers.dev/mcp
      - name: Publish current-generation evidence
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          test -s live-regression-report.json || exit 0
          status="$(jq -r '.status // "missing"' live-regression-report.json)"
          test "$status" = current || exit 0
          test "$(jq -r '.test_count // 0' live-regression-report.json)" = "$(jq -r '.passed_count // 0' live-regression-report.json)"
          test "$(jq -r '.failed_count // 0' live-regression-report.json)" = 0
          test "$(jq -r '.skipped_count // 0' live-regression-report.json)" = 0
          deployment_commit="$(jq -r '.deployment_commit // empty' live-regression-report.json)"
          test "$deployment_commit" != ""
          mkdir -p evidence/live-regression
          cp live-regression-report.json "evidence/live-regression/${deployment_commit}.json"
          cp live-regression-report.json evidence/live-regression/current.json
          npm ci --ignore-scripts
          npm run knowledge:build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/live-regression docs/opentax
          git diff --cached --quiet && exit 0
          git commit -m "ci: record live regression evidence ${deployment_commit:0:12}"
          git push
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: openfin-live-regression-${{ github.sha }}
          path: live-regression-report.json
          if-no-files-found: warn
